```yaml
name: CYBERFOX OrangeFox - Pixel 6a (bluejay)

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: OrangeFox manifest branch
        required: true
        type: choice
        options:
          - "12.1"
        default: "12.1"

      DEVICE_TREE_BRANCH:
        description: Tensor Pixel device-tree branch
        required: true
        type: string
        default: "R12_16"

      BUILD_TYPE:
        description: Beta keeps ADB enabled for testing; Stable disables it by design
        required: true
        type: choice
        options:
          - Beta
          - Stable
        default: Beta

      BUILD_JOBS:
        description: Parallel build jobs
        required: true
        type: choice
        options:
          - "2"
          - "3"
          - "4"
        default: "2"

permissions:
  contents: write

concurrency:
  group: cyberfox-bluejay-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build CYBERFOX for Pixel 6a bluejay
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    env:
      ORANGEFOX_ROOT: ${{ github.workspace }}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}
      DEVICE_TREE_URL: https://github.com/leegarchat/twrp_device_google_pixels.git
      DEVICE_TREE_PATH: ${{ github.workspace }}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/device/google/pixels
      BUILD_NAME: CyberFox-Bluejay
      BUILD_TYPE: ${{ inputs.BUILD_TYPE }}
      BUILD_JOBS: ${{ inputs.BUILD_JOBS }}

    steps:
      - name: Checkout builder repository and CyberFox overlay
        uses: actions/checkout@v4

      - name: Verify CyberFox overlay files
        shell: bash
        run: |
          set -euo pipefail

          test -f "$GITHUB_WORKSPACE/cyberfox/apply-cyberfox-theme.py"
          test -f "$GITHUB_WORKSPACE/cyberfox/theme/pages/cyberfox.xml"
          test -f "$GITHUB_WORKSPACE/cyberfox/theme/images/Splash/cyberfox_bg.svg"
          test -f "$GITHUB_WORKSPACE/cyberfox/theme/images/SVG/Logos/cyberfox.svg"

          echo "CyberFox overlay files verified."

      - name: Prepare build environment
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            aria2 \
            git \
            python3 \
            python3-pip \
            ccache

          git clone --depth=1 \
            https://gitlab.com/OrangeFox/misc/scripts.git \
            "$GITHUB_WORKSPACE/of-scripts"

          sudo bash "$GITHUB_WORKSPACE/of-scripts/setup/android_build_env.sh"

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: cyberfox-bluejay-${{ inputs.MANIFEST_BRANCH }}-${{ inputs.DEVICE_TREE_BRANCH }}
          max-size: 10G

      - name: Sync OrangeFox source
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/OrangeFox"

          git clone --depth=1 \
            --branch master \
            https://gitlab.com/OrangeFox/sync.git \
            "$GITHUB_WORKSPACE/OrangeFox/sync"

          cd "$GITHUB_WORKSPACE/OrangeFox/sync"

          ./orangefox_sync.sh \
            --branch "${{ inputs.MANIFEST_BRANCH }}" \
            --path "$ORANGEFOX_ROOT"

      - name: Clone Pixel 6a Tensor device tree
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$(dirname "$DEVICE_TREE_PATH")"

          if [ -e "$DEVICE_TREE_PATH" ]; then
            echo "ERROR: Device tree path already exists."
            exit 1
          fi

          git clone \
            --branch "${{ inputs.DEVICE_TREE_BRANCH }}" \
            "$DEVICE_TREE_URL" \
            "$DEVICE_TREE_PATH"

          test -f "$DEVICE_TREE_PATH/devices/bluejay/device.conf"
          test -f "$DEVICE_TREE_PATH/build.sh"

          grep -qx 'DEVICE=bluejay' \
            "$DEVICE_TREE_PATH/devices/bluejay/device.conf"

          grep -qx 'FAMILY=gs101' \
            "$DEVICE_TREE_PATH/devices/bluejay/device.conf"

          echo "DEVICE_TREE_COMMIT=$(git -C "$DEVICE_TREE_PATH" rev-parse HEAD)" >> "$GITHUB_ENV"

          echo "Pixel device tree verified."

      - name: Fix Pixel device lunch target
        shell: bash
        run: |
          set -euo pipefail

          cd "$DEVICE_TREE_PATH"

          sed -i \
            's/twrp_pixels-bp2a-eng/twrp_pixels-eng/g' \
            AndroidProducts.mk build.sh

          grep -q 'twrp_pixels-eng' AndroidProducts.mk
          grep -q 'lunch twrp_pixels-eng' build.sh

          if grep -q 'twrp_pixels-bp2a-eng' AndroidProducts.mk build.sh; then
            echo "ERROR: Invalid bp2a lunch target remains."
            exit 1
          fi

          echo "Pixel lunch target corrected."

      - name: Align Pixel 6a API with OrangeFox 12.1
        shell: bash
        run: |
          set -euo pipefail

          cd "$DEVICE_TREE_PATH"

          test -f BoardConfig.mk
          test -f device.mk

          sed -i \
            '/^[[:space:]]*BOARD_SYSTEMSDK_VERSIONS[[:space:]]*[:?+]*=/d' \
            BoardConfig.mk

          sed -i \
            's/^PRODUCT_SHIPPING_API_LEVEL[[:space:]]*:=.*/PRODUCT_SHIPPING_API_LEVEL := 32/' \
            device.mk

          sed -i \
            '/^DEVICE_PATH[[:space:]]*:=/a BOARD_SYSTEMSDK_VERSIONS := 32' \
            BoardConfig.mk

          grep -q '^BOARD_SYSTEMSDK_VERSIONS := 32$' BoardConfig.mk
          grep -q '^PRODUCT_SHIPPING_API_LEVEL := 32$' device.mk

          echo "Pixel 6a API configuration verified."

      # IMPORTANT:
      # OrangeFox 12.1 Soong does not support recovery variants for Rust
      # binaries. Build the Rust modules as normal system binaries instead.
      # The three required binaries are then staged into the recovery ramdisk.

      - name: Fix OrangeFox 12.1 Rust recovery variant incompatibility
        shell: bash
        run: |
          set -euo pipefail

          cd "$DEVICE_TREE_PATH"

          echo "Patching unsupported Rust recovery variants..."

          python3 - <<'PY'
          from pathlib import Path
          import sys

          rust_files = [
              "include/recovery-pixel-boot/Android.bp",
              "include/recovery-tensor-daemon/Android.bp",
              "include/avbctl/Android.bp",
              "include/ramdisk_snapshot/Android.bp",
          ]

          for rel in rust_files:
              path = Path(rel)

              if not path.is_file():
                  sys.exit(f"ERROR: Missing Rust module file: {rel}")

              data = path.read_text()

              if "rust_binary {" not in data:
                  sys.exit(f"ERROR: Expected rust_binary module in {rel}")

              count = data.count("    recovery: true,")

              if count > 1:
                  sys.exit(f"ERROR: Unexpected multiple recovery properties in {rel}")

              if count == 1:
                  data = data.replace("    recovery: true,\n", "", 1)
                  path.write_text(data)
                  print(f"PATCHED: {rel}")
              else:
                  print(f"Already patched: {rel}")

              if "    recovery: true," in data:
                  sys.exit(f"ERROR: Recovery property remains in {rel}")

          print("Rust module definitions patched.")
          PY

          echo "Adding Rust binaries to recovery build dependencies..."

          python3 - <<'PY'
          from pathlib import Path

          board = Path("BoardConfig.mk")
          data = board.read_text()

          addition = (
              "\n"
              "# CYBERFOX: Build normal system Rust binaries before recovery staging.\n"
              "INTERNAL_RECOVERYIMAGE_FILES += \\\n"
              "    $(TARGET_OUT)/bin/fox_avbctl \\\n"
              "    $(TARGET_OUT)/bin/recovery-pixel-boot \\\n"
              "    $(TARGET_OUT)/bin/recovery-tensor-daemon\n"
          )

          marker = "CYBERFOX: Build normal system Rust binaries"

          if marker not in data:
              board.write_text(data + addition)

          print("Recovery build dependencies configured.")
          PY

          echo "Adding Rust binary staging to build callback..."

          python3 - <<'PY'
          from pathlib import Path
          import sys

          callback = Path("include/prebuilt/fox_build_callback.sh")
          data = callback.read_text()

          marker = (
              '        PRODUCT_OUT="${TARGET_DIR%/recovery/root}"\n'
              '\n'
              '        echo "    [PLATFORM] Injecting both keymint HALs (universal payload)"\n'
          )

          addition = r'''        # CYBERFOX: Rust binaries are built as normal system modules.
                  # Stage them into the recovery ramdisk after Soong builds them.
                  for rust_bin in \
                      fox_avbctl \
                      recovery-pixel-boot \
                      recovery-tensor-daemon
                  do
                      rust_src="$PRODUCT_OUT/system/bin/$rust_bin"
                      rust_dst="$TARGET_DIR/system/bin/$rust_bin"

                      if [ ! -s "$rust_src" ]; then
                          echo "    [RUST] ERROR: Missing system binary: $rust_src"
                          return 1
                      fi

                      install -D -m 0755 "$rust_src" "$rust_dst"
                      echo "    [RUST] + $rust_bin staged into recovery"
                  done

          '''

          if "CYBERFOX: Rust binaries are built as normal system modules." not in data:
              if data.count(marker) != 1:
                  sys.exit(
                      "ERROR: Could not uniquely locate Rust staging insertion point "
                      "in fox_build_callback.sh."
                  )

              data = data.replace(marker, marker.replace(
                  '        echo "    [PLATFORM] Injecting both keymint HALs (universal payload)"\n',
                  addition + '        echo "    [PLATFORM] Injecting both keymint HALs (universal payload)"\n'
              ), 1)

              callback.write_text(data)

          print("Recovery callback staging configured.")
          PY

          echo "===== VERIFY RUST PATCH ====="

          for file in \
              include/recovery-pixel-boot/Android.bp \
              include/recovery-tensor-daemon/Android.bp \
              include/avbctl/Android.bp \
              include/ramdisk_snapshot/Android.bp
          do
              if grep -q 'recovery: true' "$file"; then
                  echo "ERROR: Unsupported recovery property remains: $file"
                  exit 1
              fi
          done

          grep -q 'fox_avbctl' BoardConfig.mk
          grep -q 'recovery-pixel-boot' BoardConfig.mk
          grep -q 'recovery-tensor-daemon' BoardConfig.mk

          grep -q 'CYBERFOX: Rust binaries are built as normal system modules.' \
            include/prebuilt/fox_build_callback.sh

          for module in fox_avbctl recovery-pixel-boot recovery-tensor-daemon; do
              grep -q "$module" device.mk
          done

          echo "Rust compatibility patch verified."

      - name: Apply CyberFox theme
        shell: bash
        run: |
          set -euo pipefail

          python3 "$GITHUB_WORKSPACE/cyberfox/apply-cyberfox-theme.py" \
            --source "$ORANGEFOX_ROOT"

      - name: Prepare missing Android build dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd "$ORANGEFOX_ROOT"

          mkdir -p external

          if [ ! -f external/guava/Android.bp ]; then
            rm -rf external/guava

            git clone --depth=1 \
              --branch android-12.1.0_r18 \
              https://android.googlesource.com/platform/external/guava \
              external/guava
          fi

          if [ ! -f external/gflags/Android.bp ]; then
            rm -rf external/gflags

            git clone --depth=1 \
              --branch android-12.1.0_r18 \
              https://android.googlesource.com/platform/external/gflags \
              external/gflags
          fi

          test -f external/guava/Android.bp
          test -f external/gflags/Android.bp

          echo "Guava and GFlags dependencies are ready."

      - name: Verify final Pixel build configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$DEVICE_TREE_PATH"

          echo "===== DEVICE CONFIGURATION ====="
          cat devices/bluejay/device.conf

          echo "===== LUNCH CONFIGURATION ====="
          grep -n 'twrp_pixels' AndroidProducts.mk build.sh

          echo "===== SDK CONFIGURATION ====="
          grep -n 'BOARD_SYSTEMSDK_VERSIONS' BoardConfig.mk
          grep -n 'PRODUCT_SHIPPING_API_LEVEL' device.mk

          echo "===== RUST MODULE CONFIGURATION ====="

          for file in \
              include/recovery-pixel-boot/Android.bp \
              include/recovery-tensor-daemon/Android.bp \
              include/avbctl/Android.bp \
              include/ramdisk_snapshot/Android.bp
          do
              if grep -q 'recovery: true' "$file"; then
                  echo "ERROR: Rust recovery variant remains in $file"
                  exit 1
              fi
          done

          echo "===== BUILD SCRIPT ====="
          test -f build.sh
          test -x build.sh || chmod +x build.sh

          echo "Configuration checks passed."

      - name: Build universal AIO recovery package
        shell: bash
        run: |
          set -euo pipefail

          cd "$DEVICE_TREE_PATH"

          export USE_CCACHE=1
          export CCACHE_EXEC="$(command -v ccache)"

          ccache -M 10G

          bash ./build.sh \
            -n "$BUILD_NAME" \
            --build-type "$BUILD_TYPE" \
            -j "$BUILD_JOBS" \
            --no-patches

      - name: Collect and verify build outputs
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/release"

          if [ ! -d "$DEVICE_TREE_PATH/builds" ]; then
            echo "ERROR: Build output directory does not exist."
            exit 1
          fi

          ZIP_FILE="$(find "$DEVICE_TREE_PATH/builds" \
            -maxdepth 1 \
            -type f \
            -name "OrangeFox-*-${BUILD_NAME}-aio.zip" \
            -print -quit)"

          RAMDISK_FILE="$(find "$DEVICE_TREE_PATH/builds" \
            -maxdepth 1 \
            -type f \
            -name "OrangeFox-*-${BUILD_NAME}-aio.ramdisk.lz4" \
            -print -quit)"

          if [ -z "$ZIP_FILE" ] || [ ! -s "$ZIP_FILE" ]; then
            echo "ERROR: Universal AIO installer ZIP was not produced."

            find "$DEVICE_TREE_PATH/builds" \
              -maxdepth 2 \
              -type f \
              -print || true

            exit 1
          fi

          cp "$ZIP_FILE" "$GITHUB_WORKSPACE/release/"

          if [ -n "$RAMDISK_FILE" ] && [ -s "$RAMDISK_FILE" ]; then
            cp "$RAMDISK_FILE" "$GITHUB_WORKSPACE/release/"
          fi

          cd "$GITHUB_WORKSPACE/release"

          sha256sum * | tee SHA256SUMS.txt

          echo "Build tree commit: $DEVICE_TREE_COMMIT"
          echo "Build type: $BUILD_TYPE"

          echo "===== RELEASE FILES ====="
          ls -lh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CYBERFOX-Bluejay-${{ github.run_number }}
          path: release/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish prerelease
        uses: softprops/action-gh-release@v2
        with:
          name: CYBERFOX OrangeFox for Pixel 6a - ${{ github.run_number }}
          tag_name: cyberfox-bluejay-${{ github.run_id }}
          prerelease: true
          files: release/*
          body: |
            CYBERFOX OrangeFox recovery build for Google Pixel 6a (bluejay).

            Device: Google Pixel 6a
            Codename: bluejay
            SoC family: gs101

            Device tree: ${{ env.DEVICE_TREE_URL }}
            Device tree branch: ${{ inputs.DEVICE_TREE_BRANCH }}
            Device tree commit: ${{ env.DEVICE_TREE_COMMIT }}

            OrangeFox manifest branch: ${{ inputs.MANIFEST_BRANCH }}
            Build type: ${{ inputs.BUILD_TYPE }}

            Package: Universal AIO installer ZIP

            This is an unofficial test build.
            Verify the SHA-256 checksum before installation.
            Keep a known-good stock vendor_boot backup.
            Do not raw-flash the .ramdisk.lz4 payload.
```
