name: CYBERFOX OrangeFox - Pixel 6a (bluejay)

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: OrangeFox manifest branch
        required: true
        type: choice
        options:
          - "12.1"
        default: "12.1"

      DEVICE_TREE_BRANCH:
        description: Tensor Pixel device-tree branch
        required: true
        type: string
        default: "R12_16"

      BUILD_TYPE:
        description: Beta keeps ADB enabled for testing; Stable disables it by design
        required: true
        type: choice
        options:
          - Beta
          - Stable
        default: Beta

      BUILD_JOBS:
        description: Parallel build jobs (use 2 on standard GitHub runners)
        required: true
        type: choice
        options:
          - "2"
          - "3"
          - "4"
        default: "2"

permissions:
  contents: write

concurrency:
  group: cyberfox-bluejay-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build CYBERFOX for Pixel 6a bluejay
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    env:
      MANIFEST_BRANCH: ${{ inputs.MANIFEST_BRANCH }}
      DEVICE_TREE_BRANCH: ${{ inputs.DEVICE_TREE_BRANCH }}
      ORANGEFOX_ROOT: ${{ github.workspace }}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}
      DEVICE_TREE_URL: https://github.com/leegarchat/twrp_device_google_pixels.git
      DEVICE_TREE_PATH: ${{ github.workspace }}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/device/google/pixels
      BUILD_NAME: CyberFox-Bluejay
      BUILD_TYPE: ${{ inputs.BUILD_TYPE }}
      BUILD_JOBS: ${{ inputs.BUILD_JOBS }}

    steps:
      - name: Checkout builder repository and CyberFox overlay
        uses: actions/checkout@v4

      - name: Verify CyberFox overlay files
        shell: bash
        run: |
          set -euo pipefail
          test -f "$GITHUB_WORKSPACE/cyberfox/apply-cyberfox-theme.py"
          test -f "$GITHUB_WORKSPACE/cyberfox/theme/pages/cyberfox.xml"
          test -f "$GITHUB_WORKSPACE/cyberfox/theme/images/Splash/cyberfox_bg.svg"
          test -f "$GITHUB_WORKSPACE/cyberfox/theme/images/SVG/Logos/cyberfox.svg"

      - name: Prepare build environment
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y aria2 git python3 python3-pip ccache
          git clone --depth=1 \
            https://gitlab.com/OrangeFox/misc/scripts.git \
            "$GITHUB_WORKSPACE/of-scripts"
          sudo bash "$GITHUB_WORKSPACE/of-scripts/setup/android_build_env.sh"

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: cyberfox-bluejay-${{ inputs.MANIFEST_BRANCH }}-${{ inputs.DEVICE_TREE_BRANCH }}
          max-size: 10G

      - name: Sync OrangeFox source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/OrangeFox"
          git clone --depth=1 --branch master \
            https://gitlab.com/OrangeFox/sync.git \
            "$GITHUB_WORKSPACE/OrangeFox/sync"
          cd "$GITHUB_WORKSPACE/OrangeFox/sync"
          ./orangefox_sync.sh \
            --branch "$MANIFEST_BRANCH" \
            --path "$ORANGEFOX_ROOT"

      - name: Prepare Pixel device tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$DEVICE_TREE_PATH")"

          if [ -e "$DEVICE_TREE_PATH" ]; then
            echo "Device-tree path already exists; fetching the requested branch."
            if ! git -C "$DEVICE_TREE_PATH" rev-parse --git-dir >/dev/null 2>&1; then
              echo "ERROR: Existing device-tree path is not a Git checkout: $DEVICE_TREE_PATH"
              exit 1
            fi
            git -C "$DEVICE_TREE_PATH" fetch --no-tags --depth=1 \
              "$DEVICE_TREE_URL" "$DEVICE_TREE_BRANCH"
            git -C "$DEVICE_TREE_PATH" checkout --force -B \
              "$DEVICE_TREE_BRANCH" FETCH_HEAD
          else
            git clone --depth=1 \
              --branch "$DEVICE_TREE_BRANCH" \
              "$DEVICE_TREE_URL" \
              "$DEVICE_TREE_PATH"
          fi

          test -f "$DEVICE_TREE_PATH/devices/bluejay/device.conf"
          test -f "$DEVICE_TREE_PATH/build.sh"
          grep -qx 'DEVICE=bluejay' "$DEVICE_TREE_PATH/devices/bluejay/device.conf"
          grep -qx 'FAMILY=gs101' "$DEVICE_TREE_PATH/devices/bluejay/device.conf"

          echo "DEVICE_TREE_COMMIT=$(git -C "$DEVICE_TREE_PATH" rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Fix Pixel device lunch target
        shell: bash
        run: |
          set -euo pipefail
          cd "$DEVICE_TREE_PATH"

          sed -i \
            's/twrp_pixels-bp2a-eng/twrp_pixels-eng/g' \
            AndroidProducts.mk build.sh

          grep -q 'twrp_pixels-eng' AndroidProducts.mk
          grep -q 'lunch twrp_pixels-eng' build.sh

          if grep -q 'twrp_pixels-bp2a-eng' AndroidProducts.mk build.sh; then
            echo "ERROR: Invalid bp2a lunch target remains."
            exit 1
          fi

          echo "Pixel lunch target corrected."

      - name: Fix Android System SDK version for TWRP 12.1
        shell: bash
        run: |
          set -euo pipefail
          cd "$DEVICE_TREE_PATH"

          test -f BoardConfig.mk
          test -f device.mk

          # TWRP 12.1's build core only accepts System SDK versions 28-32.
          # The device shipping API level remains 34; do not change it.
          sed -i \
            '/^[[:space:]]*BOARD_SYSTEMSDK_VERSIONS[[:space:]]*[:?+]*=/d' \
            BoardConfig.mk

          printf '\n# TWRP 12.1 supports System SDK versions only through 32.\nBOARD_SYSTEMSDK_VERSIONS := 32\n' \
            >> BoardConfig.mk

          grep -n 'BOARD_SYSTEMSDK_VERSIONS' BoardConfig.mk
          grep -n 'PRODUCT_SHIPPING_API_LEVEL' device.mk

          grep -q '^BOARD_SYSTEMSDK_VERSIONS := 32$' BoardConfig.mk
          grep -q '^PRODUCT_SHIPPING_API_LEVEL := 34$' device.mk

      - name: Validate CyberFox theme compatibility
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/cyberfox/apply-cyberfox-theme.py" \
            --source "$ORANGEFOX_ROOT" \
            --check-only

      - name: Apply CyberFox theme
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/cyberfox/apply-cyberfox-theme.py" \
            --source "$ORANGEFOX_ROOT"

      - name: Prepare missing Android build dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "$ORANGEFOX_ROOT"
          mkdir -p external

          if [ ! -f external/guava/Android.bp ]; then
            rm -rf external/guava
            git clone --depth=1 --branch android-12.1.0_r18 \
              https://android.googlesource.com/platform/external/guava \
              external/guava
          fi

          if [ ! -f external/gflags/Android.bp ]; then
            rm -rf external/gflags
            git clone --depth=1 --branch android-12.1.0_r18 \
              https://android.googlesource.com/platform/external/gflags \
              external/gflags
          fi

          test -f external/guava/Android.bp
          test -f external/gflags/Android.bp

      - name: Build universal AIO recovery package
        shell: bash
        run: |
          set -euo pipefail
          cd "$DEVICE_TREE_PATH"

          export USE_CCACHE=1
          export CCACHE_EXEC="$(command -v ccache)"
          ccache -M 10G

          bash ./build.sh \
            -n "$BUILD_NAME" \
            --build-type "$BUILD_TYPE" \
            -j "$BUILD_JOBS" \
            --no-patches

      - name: Collect and verify build outputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/release"

          if [ ! -d "$DEVICE_TREE_PATH/builds" ]; then
            echo "ERROR: Build output directory does not exist."
            exit 1
          fi

          mapfile -t ZIP_FILES < <(
            find "$DEVICE_TREE_PATH/builds" \
              -maxdepth 1 \
              -type f \
              -name "*${BUILD_NAME}*aio-*.zip" \
              -print
          )

          if [ "${#ZIP_FILES[@]}" -eq 0 ]; then
            echo "ERROR: No universal AIO installer ZIPs were produced."
            find "$DEVICE_TREE_PATH/builds" -maxdepth 2 -type f -print || true
            exit 1
          fi

          for zip_file in "${ZIP_FILES[@]}"; do
            test -s "$zip_file"
            cp "$zip_file" "$GITHUB_WORKSPACE/release/"
          done

          RAMDISK_FILE="$(find "$DEVICE_TREE_PATH/builds" \
            -maxdepth 1 \
            -type f \
            -name "*${BUILD_NAME}*aio.ramdisk.lz4" \
            -print -quit)"

          if [ -n "$RAMDISK_FILE" ] && [ -s "$RAMDISK_FILE" ]; then
            cp "$RAMDISK_FILE" "$GITHUB_WORKSPACE/release/"
          else
            echo "WARNING: Ramdisk payload was not produced."
          fi

          cd "$GITHUB_WORKSPACE/release"
          sha256sum * | tee SHA256SUMS.txt

          echo "Device-tree commit: $DEVICE_TREE_COMMIT"
          echo "Build type: $BUILD_TYPE"
          ls -lh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CYBERFOX-Bluejay-${{ github.run_number }}
          path: release/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish prerelease
        uses: softprops/action-gh-release@v2
        with:
          name: CYBERFOX OrangeFox for Pixel 6a - ${{ github.run_number }}
          tag_name: cyberfox-bluejay-${{ github.run_id }}
          prerelease: true
          files: release/*
          body: |
            CYBERFOX OrangeFox recovery build for Google Pixel 6a (bluejay).

            - Device tree: ${{ env.DEVICE_TREE_URL }}
            - Device tree branch: ${{ env.DEVICE_TREE_BRANCH }}
            - Device tree commit: ${{ env.DEVICE_TREE_COMMIT }}
            - OrangeFox manifest branch: ${{ env.MANIFEST_BRANCH }}
            - Build type: ${{ env.BUILD_TYPE }}
            - Package: universal AIO installer ZIP

            This is an unofficial test build. Verify the SHA-256 checksum and keep a known-good stock vendor_boot backup. Do not raw-flash the AIO ramdisk payload.
