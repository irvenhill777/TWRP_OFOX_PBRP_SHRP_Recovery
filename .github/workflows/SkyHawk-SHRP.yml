
name: SkyHawk SHRP - Google Pixel 6a (bluejay)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build SHRP boot image for Pixel 6a
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    env:
      DEVICE: bluejay
      DEVICE_PATH: device/google/bluejay
      PRODUCT: omni_bluejay
      MANIFEST_URL: https://github.com/SHRP-Reborn/manifest.git
      MANIFEST_BRANCH: shrp-12.1
      DEVICE_TREE_URL: https://github.com/twrpdtgen/android_device_google_bluejay.git
      DEVICE_TREE_BRANCH: bluejay_beta-user-UpsideDownCake-UPP2.230217.004-9663077-release-keys
      OUTPUT_DIR: android-recovery/out/target/product/bluejay
      USE_CCACHE: "1"
      ALLOW_MISSING_DEPENDENCIES: "true"

    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Display build configuration
        run: |
          echo "Device: Google Pixel 6a"
          echo "Codename: $DEVICE"
          echo "Product: $PRODUCT"
          echo "Manifest: $MANIFEST_URL ($MANIFEST_BRANCH)"
          echo "Device tree: $DEVICE_TREE_URL ($DEVICE_TREE_BRANCH)"
          echo "Build target: bootimage"

      - name: Free disk space
        uses: rokibhasansagar/slimhub_actions@main

      - name: Set up swap
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git git-lfs gnupg gperf imagemagick lib32ncurses-dev lib32readline-dev \
            lib32z1-dev libelf-dev liblz4-tool libncurses-dev libssl-dev \
            libxml2-utils lzop pngcrush python3 python-is-python3 rsync \
            schedtool squashfs-tools unzip wget zip zlib1g-dev

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "11"

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: shrp-bluejay-shrp-12.1
          restore-keys: shrp-bluejay-
          max-size: 10G

      - name: Install repo tool
        run: |
          mkdir -p "$HOME/bin"
          curl -fL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Initialize SHRP source
        run: |
          mkdir -p android-recovery
          cd android-recovery
          git config --global user.name "Pixel 6a SHRP Builder"
          git config --global user.email "bluejay-builder@users.noreply.github.com"
          repo init --depth=1 -u "$MANIFEST_URL" -b "$MANIFEST_BRANCH"

      - name: Sync SHRP source
        run: |
          cd android-recovery
          repo sync -c -j2 --force-sync --no-clone-bundle --no-tags

      - name: Clone Pixel 6a device tree
        run: |
          cd android-recovery
          rm -rf "$DEVICE_PATH"
          mkdir -p "$(dirname "$DEVICE_PATH")"
          git clone --depth=1 --single-branch -b "$DEVICE_TREE_BRANCH" \
            "$DEVICE_TREE_URL" "$DEVICE_PATH"
          echo "Device tree commit: $(git -C "$DEVICE_PATH" rev-parse HEAD)"

      - name: Verify Pixel 6a device tree
        run: |
          TREE="android-recovery/$DEVICE_PATH"

          test -f "$TREE/BoardConfig.mk" || {
            echo "::error::BoardConfig.mk is missing."
            exit 1
          }

          test -f "$TREE/AndroidProducts.mk" || {
            echo "::error::AndroidProducts.mk is missing."
            exit 1
          }

          test -f "$TREE/omni_bluejay.mk" || {
            echo "::error::omni_bluejay.mk is missing."
            exit 1
          }

          grep -Eq 'BOARD_USES_RECOVERY_AS_BOOT[[:space:]]*:?=[[:space:]]*true' "$TREE/BoardConfig.mk" || {
            echo "::error::Expected bluejay recovery-as-boot configuration."
            exit 1
          }

          grep -q 'omni_bluejay' "$TREE/AndroidProducts.mk" || {
            echo "::error::omni_bluejay is not listed in AndroidProducts.mk."
            exit 1
          }

          grep -q 'TARGET_BOARD_PLATFORM.*gs101' "$TREE/BoardConfig.mk" || {
            echo "::error::Expected Google Tensor gs101 platform configuration."
            exit 1
          }

          echo "Pixel 6a device tree checks passed."

      - name: Build SkyHawk Recovery boot image
        run: |
          cd android-recovery
          export ALLOW_MISSING_DEPENDENCIES=true
          export USE_CCACHE=1

          source build/envsetup.sh
          lunch omni_bluejay-eng
          mka bootimage -j2

      - name: Verify and checksum boot image
        run: |
          IMAGE="$OUTPUT_DIR/boot.img"

          if [ ! -f "$IMAGE" ]; then
            echo "::error::boot.img was not generated at $IMAGE"
            echo "Available image files:"
            find "$OUTPUT_DIR" -maxdepth 2 -type f -name "*.img" -print 2>/dev/null || true
            exit 1
          fi

          sha256sum "$IMAGE" | tee "$IMAGE.sha256"
          md5sum "$IMAGE" | tee "$IMAGE.md5"
          ls -lh "$IMAGE" "$IMAGE.sha256" "$IMAGE.md5"

      - name: Upload Pixel 6a boot image
        uses: actions/upload-artifact@v4
        with:
          name: SHRP-Pixel-6a-bluejay-boot
          path: |
            ${{ env.OUTPUT_DIR }}/boot.img
            ${{ env.OUTPUT_DIR }}/boot.img.sha256
            ${{ env.OUTPUT_DIR }}/boot.img.md5
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
