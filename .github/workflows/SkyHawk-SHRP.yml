name: SkyHawk SHRP - Google Pixel 6a

on:
  workflow_dispatch:
    inputs:
      MANIFEST:
        description: SHRP manifest
        required: true
        default: [github.com](https://github.com/SHRP-Reborn/manifest.git)

      MANIFEST_BRANCH:
        description: SHRP manifest branch
        required: true
        default: shrp-12.1

      DEVICE_TREE:
        description: Pixel 6a SHRP/TWRP device tree
        required: true
        default: REPLACE_WITH_BLUEJAY_RECOVERY_TREE

      DEVICE_TREE_BRANCH:
        description: Device tree branch
        required: true
        default: android-12.1

      DEVICE_PATH:
        description: Device tree destination
        required: true
        default: device/google/bluejay

      DEVICE_NAME:
        description: Device codename
        required: true
        default: bluejay

      DEVICE_MAKEFILE:
        description: Recovery product makefile
        required: true
        default: twrp_bluejay

      BUILD_TARGET:
        description: Recovery build target
        required: true
        type: choice
        default: boot
        options:
          - boot
          - vendorboot
          - recovery

jobs:
  build:
    name: Build SHRP for Pixel 6a
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    permissions:
      contents: read

    env:
      DEVICE: ${{ inputs.DEVICE_NAME }}
      DEVICE_PATH: ${{ inputs.DEVICE_PATH }}
      OUTPUT_DIR: android-recovery/out/target/product/${{ inputs.DEVICE_NAME }}
      CCACHE_EXEC: /usr/bin/ccache
      USE_CCACHE: "1"
      CCACHE_COMPRESS: "1"
      ALLOW_MISSING_DEPENDENCIES: "true"

    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Display build information
        run: |
          echo "================================"
          echo "Device: Google Pixel 6a"
          echo "Codename: ${{ inputs.DEVICE_NAME }}"
          echo "Manifest: ${{ inputs.MANIFEST }}"
          echo "Manifest branch: ${{ inputs.MANIFEST_BRANCH }}"
          echo "Device tree: ${{ inputs.DEVICE_TREE }}"
          echo "Device branch: ${{ inputs.DEVICE_TREE_BRANCH }}"
          echo "Device path: ${{ inputs.DEVICE_PATH }}"
          echo "Build target: ${{ inputs.BUILD_TARGET }}"
          echo "================================"

      - name: Free disk space
        uses: rokibhasansagar/slimhub_actions@main

      - name: Set up swap
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            g++-multilib \
            gcc-multilib \
            git \
            git-lfs \
            gnupg \
            gperf \
            imagemagick \
            lib32ncurses-dev \
            lib32readline-dev \
            lib32z1-dev \
            libelf-dev \
            liblz4-tool \
            libncurses-dev \
            libssl-dev \
            libxml2-utils \
            lzop \
            pngcrush \
            python3 \
            python-is-python3 \
            rsync \
            schedtool \
            squashfs-tools \
            unzip \
            wget \
            zip \
            zlib1g-dev

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "11"

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: shrp-bluejay-${{ inputs.MANIFEST_BRANCH }}
          restore-keys: |
            shrp-bluejay-
          max-size: 10G

      - name: Install repo tool
        run: |
          mkdir -p "$HOME/bin"

          curl -fL \
            [storage.googleapis.com](https://storage.googleapis.com/git-repo-downloads/repo) \
            -o "$HOME/bin/repo"

          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Initialize SHRP source
        run: |
          mkdir -p android-recovery
          cd android-recovery

          git config --global user.name "Pixel 6a SHRP Builder"
          git config --global user.email \
            "bluejay-builder@users.noreply.github.com"

          repo init \
            --depth=1 \
            -u "${{ inputs.MANIFEST }}" \
            -b "${{ inputs.MANIFEST_BRANCH }}"

      - name: Sync SHRP source
        run: |
          cd android-recovery

          repo sync \
            -c \
            -j2 \
            --force-sync \
            --no-clone-bundle \
            --no-tags

      - name: Clone Pixel 6a device tree
        run: |
          cd android-recovery

          rm -rf "${{ inputs.DEVICE_PATH }}"
          mkdir -p "$(dirname "${{ inputs.DEVICE_PATH }}")"

          git clone \
            --depth=1 \
            --single-branch \
            -b "${{ inputs.DEVICE_TREE_BRANCH }}" \
            "${{ inputs.DEVICE_TREE }}" \
            "${{ inputs.DEVICE_PATH }}"

          cd "${{ inputs.DEVICE_PATH }}"
          echo "DEVICE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Verify Pixel 6a device tree
        run: |
          TREE="android-recovery/${{ inputs.DEVICE_PATH }}"

          test -f "$TREE/BoardConfig.mk"
          test -f "$TREE/AndroidProducts.mk"

          PRODUCT="${{ inputs.DEVICE_MAKEFILE }}"

          if [ ! -f "$TREE/$PRODUCT.mk" ]; then
            echo "::error::Missing $TREE/$PRODUCT.mk"
            echo "Available product makefiles:"
            find "$TREE" -maxdepth 1 -name "*.mk" -print
            exit 1
          fi

          grep -q "$PRODUCT" "$TREE/AndroidProducts.mk" || {
            echo "::warning::$PRODUCT is not listed literally in AndroidProducts.mk."
          }

          echo "Pixel 6a device tree verified."

      - name: Set build command
        run: |
          case "${{ inputs.BUILD_TARGET }}" in
            boot)
              echo "BUILD_COMMAND=bootimage" >> "$GITHUB_ENV"
              echo "OUTPUT_IMAGE=boot.img" >> "$GITHUB_ENV"
              ;;

            vendorboot)
              echo "BUILD_COMMAND=vendorbootimage" >> "$GITHUB_ENV"
              echo "OUTPUT_IMAGE=vendor_boot.img" >> "$GITHUB_ENV"
              ;;

            recovery)
              echo "BUILD_COMMAND=recoveryimage" >> "$GITHUB_ENV"
              echo "OUTPUT_IMAGE=recovery.img" >> "$GITHUB_ENV"
              ;;

            *)
              echo "::error::Unsupported build target."
              exit 1
              ;;
          esac

      - name: Set up build environment
        run: |
          cd android-recovery

          source build/envsetup.sh
          lunch "${{ inputs.DEVICE_MAKEFILE }}-eng"

      - name: Build SkyHawk Recovery
        run: |
          cd android-recovery

          export ALLOW_MISSING_DEPENDENCIES=true
          export USE_CCACHE=1

          source build/envsetup.sh
          lunch "${{ inputs.DEVICE_MAKEFILE }}-eng"

          mka "$BUILD_COMMAND" -j2

      - name: Verify recovery artifact
        run: |
          IMAGE="$OUTPUT_DIR/$OUTPUT_IMAGE"

          if [ ! -f "$IMAGE" ]; then
            echo "::error::Expected image was not generated: $IMAGE"
            echo "Images found in output directory:"
            find "$OUTPUT_DIR" \
              -maxdepth 1 \
              -type f \
              \( -name "*.img" -o -name "*.zip" \) \
              -print || true
            exit 1
          fi

          sha256sum "$IMAGE" | tee "$IMAGE.sha256"
          md5sum "$IMAGE" | tee "$IMAGE.md5"
          ls -lh "$IMAGE" "$IMAGE.sha256" "$IMAGE.md5"

      - name: Upload Pixel 6a recovery artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SHRP-Pixel-6a-bluejay-${{ inputs.BUILD_TARGET }}
          path: |
            ${{ env.OUTPUT_DIR }}/${{ env.OUTPUT_IMAGE }}
            ${{ env.OUTPUT_DIR }}/${{ env.OUTPUT_IMAGE }}.sha256
            ${{ env.OUTPUT_DIR }}/${{ env.OUTPUT_IMAGE }}.md5
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
