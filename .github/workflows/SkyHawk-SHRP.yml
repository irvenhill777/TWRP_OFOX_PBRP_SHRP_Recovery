
name: SkyHawk SHRP - Moto G Stylus 5G 2024

on:
  workflow_dispatch:
    inputs:
      MANIFEST:
        description: SHRP Manifest
        required: true
        default: https://github.com/SHRP-Reborn/manifest.git

      MANIFEST_BRANCH:
        description: SHRP Manifest Branch
        required: true
        type: choice
        default: shrp-12.1
        options:
          - shrp-12.1

      DEVICE_TREE:
        description: Boston Device Tree
        required: true
        default: https://github.com/PizzaG/android_device_motorola_boston.git

      DEVICE_TREE_BRANCH:
        description: Boston Device Tree Branch
        required: true
        default: TWRP

      DEVICE_PATH:
        description: Device Tree Location
        required: true
        default: device/motorola/boston

      DEVICE_NAME:
        description: Device Codename
        required: true
        default: boston

      BUILD_TARGET:
        description: Recovery Image Target
        required: true
        type: choice
        default: recovery
        options:
          - recovery

jobs:
  build:
    name: Build SHRP for Boston
    runs-on: ubuntu-22.04

    permissions:
      contents: read

    env:
      DEVICE: boston
      DEVICE_PATH: device/motorola/boston
      OUTPUT_DIR: android-recovery/out/target/product/boston

    steps:
      - name: Checkout Builder
        uses: actions/checkout@v4

      - name: Display Build Information
        run: |
          echo "================================"
          echo "Device: Moto G Stylus 5G 2024"
          echo "Codename: boston"
          echo "Model: XT2419-1"
          echo "Manifest: ${{ inputs.MANIFEST }}"
          echo "Manifest Branch: ${{ inputs.MANIFEST_BRANCH }}"
          echo "Device Tree: ${{ inputs.DEVICE_TREE }}"
          echo "Device Branch: ${{ inputs.DEVICE_TREE_BRANCH }}"
          echo "================================"

      - name: Free Disk Space
        uses: rokibhasansagar/slimhub_actions@main

      - name: Setup Swap
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            g++-multilib \
            gcc-multilib \
            git \
            git-lfs \
            gnupg \
            gperf \
            imagemagick \
            lib32ncurses-dev \
            lib32readline-dev \
            lib32z1-dev \
            libelf-dev \
            liblz4-tool \
            libncurses-dev \
            libssl-dev \
            libxml2-utils \
            lzop \
            pngcrush \
            python3 \
            python-is-python3 \
            rsync \
            schedtool \
            squashfs-tools \
            unzip \
            wget \
            zip \
            zlib1g-dev

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '11'

      - name: Setup Ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: shrp-boston
          max-size: 10G

      - name: Install Repo Tool
        run: |
          mkdir -p "$HOME/bin"
          curl -fL \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Initialize SHRP Source
        run: |
          mkdir -p android-recovery
          cd android-recovery

          git config --global user.name "Boston SHRP Builder"
          git config --global user.email "boston-builder@users.noreply.github.com"

          repo init \
            --depth=1 \
            -u "${{ inputs.MANIFEST }}" \
            -b "${{ inputs.MANIFEST_BRANCH }}"

      - name: Sync SHRP Source
        run: |
          cd android-recovery

          repo sync \
            -c \
            -j2 \
            --force-sync \
            --no-clone-bundle \
            --no-tags

      - name: Clone Boston Device Tree
        run: |
          cd android-recovery

          mkdir -p device/motorola

          git clone \
            --depth=1 \
            -b "${{ inputs.DEVICE_TREE_BRANCH }}" \
            "${{ inputs.DEVICE_TREE }}" \
            device/motorola/boston

          cd device/motorola/boston

          echo "DEVICE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Verify Boston Device Tree
        run: |
          cd android-recovery

          test -f device/motorola/boston/BoardConfig.mk
          test -f device/motorola/boston/twrp_boston.mk
          test -f device/motorola/boston/AndroidProducts.mk

          echo "Boston device tree verified."

      - name: Setup Build Environment
        run: |
          cd android-recovery

          export ALLOW_MISSING_DEPENDENCIES=true

          source build/envsetup.sh

          lunch twrp_boston-eng

      - name: Build SkyHawk Recovery
        run: |
          cd android-recovery

          export ALLOW_MISSING_DEPENDENCIES=true
          export USE_CCACHE=1

          source build/envsetup.sh

          lunch twrp_boston-eng

          mka recoveryimage -j2

      - name: Verify Recovery Image
        if: always()
        run: |
          IMAGE="$OUTPUT_DIR/recovery.img"

          if [ -f "$IMAGE" ]; then
            echo "BUILD_SUCCESS=true" >> "$GITHUB_ENV"

            echo "Recovery image successfully created."

            md5sum "$IMAGE"
            ls -lh "$IMAGE"
          else
            echo "BUILD_SUCCESS=false" >> "$GITHUB_ENV"
            echo "::error::Boston recovery image was not found."
          fi

      - name: Upload Boston Recovery
        if: success() && env.BUILD_SUCCESS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: SHRP-Boston-XT2419-1
          path: |
            android-recovery/out/target/product/boston/recovery.img
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          
