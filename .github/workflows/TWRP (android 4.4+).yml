
name: Pixel 6a Bluejay Recovery Build

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      MANIFEST_URL:
        description: TWRP manifest repository
        required: true
        default: https://github.com/mlm-games/platform_manifest_twrp_omni

      MANIFEST_BRANCH:
        description: Compatible TWRP manifest branch
        required: true
        default: twrp-5.1

      DEVICE_TREE_URL:
        description: Pixel 6a device tree
        required: true
        default: https://github.com/twrpdtgen/android_device_google_bluejay

      DEVICE_TREE_BRANCH:
        description: Device tree branch
        required: true
        default: bluejay_beta-user-UpsideDownCake-UPP2.230217.004-9663077-release-keys

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      DEVICE: bluejay
      DEVICE_PATH: device/google/bluejay
      PRODUCT: omni_bluejay
      OUT_DIR: out/target/product/bluejay
      LC_ALL: C.UTF-8

    steps:
      - name: Checkout workflow
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex \
            g++-multilib gcc-multilib git git-lfs gnupg \
            gperf imagemagick lib32ncurses-dev lib32z1-dev \
            liblz4-tool libncurses-dev libsdl1.2-dev \
            libssl-dev libxml2 libxml2-utils lzop \
            pngcrush rsync schedtool squashfs-tools \
            xsltproc zip zlib1g-dev python3 python-is-python3 \
            openjdk-17-jdk

      - name: Configure Java
        run: |
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> "$GITHUB_ENV"
          echo "/usr/lib/jvm/java-17-openjdk-amd64/bin" >> "$GITHUB_PATH"
          java -version

      - name: Install Repo tool
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Initialize TWRP source
        run: |
          mkdir -p android-recovery
          cd android-recovery

          git config --global user.name "GitHub Actions"
          git config --global user.email \
            "actions@github.com"

          repo init \
            --depth=1 \
            -u "${{ inputs.MANIFEST_URL }}" \
            -b "${{ inputs.MANIFEST_BRANCH }}"

      - name: Sync source
        working-directory: android-recovery
        run: |
          repo sync \
            -c \
            -j2 \
            --force-sync \
            --no-clone-bundle

      - name: Clone Bluejay device tree
        working-directory: android-recovery
        run: |
          mkdir -p device/google

          git clone \
            --depth=1 \
            --single-branch \
            -b "${{ inputs.DEVICE_TREE_BRANCH }}" \
            "${{ inputs.DEVICE_TREE_URL }}" \
            "${{ env.DEVICE_PATH }}"

          test -f "${{ env.DEVICE_PATH }}/AndroidProducts.mk"
          test -f "${{ env.DEVICE_PATH }}/${{ env.PRODUCT }}.mk"

      - name: Check build target
        working-directory: android-recovery
        run: |
          echo "Device: $DEVICE"
          echo "Product: $PRODUCT"
          echo "Device tree: $DEVICE_PATH"

          grep -R "omni_bluejay" "$DEVICE_PATH" || true

      - name: Build recovery
        working-directory: android-recovery
        shell: bash
        run: |
          set -e

          source build/envsetup.sh

          export ALLOW_MISSING_DEPENDENCIES=true

          lunch "${PRODUCT}-eng"

          mka recoveryimage -j2

      - name: Verify build output
        working-directory: android-recovery
        run: |
          mkdir -p release

          find "$OUT_DIR" -maxdepth 1 -type f \
            \( -name "recovery.img" \
            -o -name "vendor_boot.img" \
            -o -name "boot.img" \
            -o -name "*.zip" \) \
            -exec cp -v {} release/ \;

          test -n "$(find release -type f -print -quit)"

          echo "Build artifacts:"
          ls -lh release/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bluejay-recovery-${{ github.run_number }}
          path: android-recovery/release/*
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bluejay-${{ github.run_number }}
          name: Bluejay Recovery Build ${{ github.run_number }}
          prerelease: true
          files: android-recovery/release/*
          body: |
            Google Pixel 6a (bluejay)

            Manifest: ${{ inputs.MANIFEST_BRANCH }}
            Device: bluejay
            Product: omni_bluejay
            Device tree: ${{ inputs.DEVICE_TREE_URL }}
            Device branch: ${{ inputs.DEVICE_TREE_BRANCH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
