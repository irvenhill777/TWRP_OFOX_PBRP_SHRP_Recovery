name: TeamWin [TWRP]

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'TWRP Manifest Branch'
        required: true
        default: 'twrp-12.1'
        type: choice
        options:
        - twrp-14.1
        - twrp-14
        - twrp-12.1
        - twrp-11
        - twrp-10.0-deprecated
        - twrp-9.0
        - twrp-8.1
        - twrp-8.1-macOS
        - twrp-7.1
        - twrp-6.0
        - twrp-5.1
        - twrp-4.4-deprecated
      DEVICE_TREE:
        description: 'Custom Recovery Tree' # Your already made Device Tree for TWRP
        required: true
        default: 'https://github.com/Kyros70/android_device_freeyond_m5a_recovery'
      DEVICE_TREE_BRANCH:
        description: 'Custom Recovery Tree Branch' # Your Device Tree Branch, make sure it's right.
        required: true
        default: 'TWRP'
      DEVICE_PATH:
        description: 'DEVICE_PATH'
        required: true
        default: 'device/chinoe/M5A'
      DEVICE_NAME:
        description: 'DEVICE_NAME'
        required: true
        default: 'M5A'
      MAKEFILE_NAME:
        description: 'MAKEFILE_NAME (excluding .mk extension, Example: omni_7304F)'
        required: true
        default: 'twrp_M5A'
      BUILD_TARGET:
        description: 'Specify your Build Target' # Pick among boot, recovery and vendor_boot
        required: true
        default: 'vendorboot'
        type: choice
        options:
        - boot
        - recovery
        - vendorboot
      LDCHECK:
        description: 'Use LDCHECK'
        required: false
        default: 'false'
        type: boolean
      LDCHECKPATH:
        description: 'Path of blobs to check' # Use it know what kind of dependencies your missing for decryption blobs.
        required: true
        default: 'system/bin/qseecomd'

jobs:
  build:
    name: Build TWRP by ${{ github.actor }}
    runs-on: namespace-profile-kyros
    if: github.event.repository.owner.id == github.event.sender.id
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
    - name: Check Out
      uses: actions/checkout@v6
      
    - name: Cleanup
      uses: rokibhasansagar/slimhub_actions@main
      
    - name: Set Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 12

    - name: Check Manifest Branch
      run: |
        if [ ${{ inputs.MANIFEST_BRANCH }} == 'twrp-11' ] || [ ${{ inputs.MANIFEST_BRANCH }} == 'twrp-12.1' ] || [ ${{ inputs.MANIFEST_BRANCH }} == 'twrp-14' ]; then
            echo "MANIFEST=https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git" >> $GITHUB_ENV
            echo "CHECK_LEGACY_BRANCH=false" >> $GITHUB_ENV
        else
            echo "MANIFEST=https://github.com/mlm-games/platform_manifest_twrp_omni.git" >> $GITHUB_ENV
            echo "CHECK_LEGACY_BRANCH=true" >> $GITHUB_ENV
        fi

    - name: Prepare the environment
      run: |
        sudo add-apt-repository -y universe
        sudo apt-get update
        sudo apt-get -y upgrade
        PKGS="gperf gcc-multilib gcc-10-multilib g++-multilib g++-10-multilib libc6-dev lib32ncurses-dev lib32ncurses5-dev x11proto-core-dev libx11-dev tree lib32z-dev libgl1-mesa-dev libxml2-utils xsltproc bc ccache lib32readline-dev lib32z1-dev liblz4-tool libncurses-dev libncurses5-dev libsdl1.2-dev libwxgtk3.2-dev libwxgtk3.0-gtk3-dev libxml2 lzop pngcrush schedtool squashfs-tools imagemagick libbz2-dev lzma ncftp qemu-user-static libstdc++-10-dev libgflags-dev python3 python-is-python3"
        INSTALL=""
        for p in $PKGS; do
            if apt-cache show "$p" > /dev/null 2>&1; then
                INSTALL="$INSTALL $p"
            else
                echo "Skipping $p, not available on this Ubuntu release"
            fi
        done
        sudo apt-get -y install $INSTALL
        if ! dpkg -s libtinfo5 > /dev/null 2>&1; then
            sudo sh -c 'echo "deb [arch=amd64 signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] http://archive.ubuntu.com/ubuntu jammy main universe" > /etc/apt/sources.list.d/jammy-legacy.list'
            sudo apt-get update -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/jammy-legacy.list -o Dir::Etc::sourceparts=/dev/null -o APT::Get::List-Cleanup=0 || true
            (cd /tmp && apt-get download libtinfo5 libncurses5 && sudo dpkg -i libtinfo5_*.deb libncurses5_*.deb) || echo "::warning::Could not install legacy libtinfo5/libncurses5"
            sudo rm -f /etc/apt/sources.list.d/jammy-legacy.list
        fi

    - name: Install OpenJDK
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: '8'

    - name: Install Git-Repo
      run: |
        curl -fL https://storage.googleapis.com/git-repo-downloads/repo -o /tmp/repo
        sudo install -m 0755 /tmp/repo /usr/local/bin/repo
        sudo ln -sf /usr/local/bin/repo /usr/bin/repo
        repo --version | head -n 3

    - name: Initialize Repo
      run: |
        mkdir android-recovery
        cd android-recovery
        git config --global user.name "${{ github.actor }}"
        git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
        repo init --depth=1 -u ${{ env.MANIFEST }} -b ${{ inputs.MANIFEST_BRANCH }}

    - name: Repo Sync
      run: |
        cd android-recovery
        repo sync -j$(nproc --all) --force-sync
      
    - name: Clone Device Tree
      env:
        PAT: ${{ secrets.PAT }}
      run: |
        test -n "$PAT" || { echo "PAT secret is empty"; exit 1; }
        cd android-recovery
        git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$PAT" | base64 -w0)" clone https://github.com/Kyros70/android_device_freeyond_m5a-recovery -b ${{ inputs.DEVICE_TREE_BRANCH }} ./${{ inputs.DEVICE_PATH }}
        cd ${{ inputs.DEVICE_PATH }}
        echo "COMMIT_ID=$(git rev-parse HEAD)" >> $GITHUB_ENV

    - name: Apply vibrator FF fallback fix
      run: |
        set -euo pipefail
        sudo apt-get install -y patch
        cd "$GITHUB_WORKSPACE/android-recovery/bootable/recovery"
        patch -p1 --fuzz=5 < "$GITHUB_WORKSPACE/android-recovery/${{ inputs.DEVICE_PATH }}/patches/0001-events-cpp-ff-vibrator.patch"
        echo "Patch applied successfully"

    - name: Apply graphics_drm.cpp fix
      run: |
        curl -fL "https://raw.githubusercontent.com/kyros70/android_bootable_recovery/android-12.1/minuitwrp/graphics_drm.cpp" \
          -o "android-recovery/bootable/recovery/minuitwrp/graphics_drm.cpp"
        echo "Patch applied successfully"
        
    - name: Installing python2 for legacy builds
      if: env.CHECK_LEGACY_BRANCH == 'true'
      run: |
        sudo apt-get install -y python2 python-is-python2 || {
            echo "::error::python2 is not available on this runner image, legacy manifest branches need an ubuntu-22.04 runner"
            exit 1
        }

    - name: Building Image 
      run: |
        cd android-recovery
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        lunch ${{ inputs.MAKEFILE_NAME }}-eng && make clean && make ${{ inputs.BUILD_TARGET }}image -j$(nproc --all)
        echo "Done building your ${{ inputs.BUILD_TARGET }}.img"

    - name: Set Build Date # Output will be use in Release
      run: |
        echo "BUILD_DATE=$(date +%Y%m%d)" >> $GITHUB_ENV
      
    - name: Compress image
      if: success()
      run: |
        cd "android-recovery/out/target/product/${{ inputs.DEVICE_NAME }}"
        img_file=$(find . -maxdepth 1 -name "vendor_boot.img" -print -quit)
        [ -n "$img_file" ] || img_file=$(find . -maxdepth 1 -name "*vendor*.img" -print -quit)
        if [ -n "$img_file" ]; then
            xz -9e -T0 -k -v -f -c "$img_file" > "${img_file#./}.xz"
        else
            echo "::warning::No vendor image found to compress"
        fi

    - name: Upload to Release
      if: success()
      uses: softprops/action-gh-release@master
      with:
        files: |
          android-recovery/out/target/product/${{ inputs.DEVICE_NAME }}/${{ inputs.BUILD_TARGET }}.img
          android-recovery/out/target/product/${{ inputs.DEVICE_NAME }}/*.img
          android-recovery/out/target/product/${{ inputs.DEVICE_NAME }}/*vendor*
          android-recovery/out/target/product/${{ inputs.DEVICE_NAME }}/*.zip
          
        name: TWRP for ${{ inputs.DEVICE_NAME }} (Unofficial)
        tag_name: ${{ github.run_id }}
        body: |
          Build: ${{ inputs.MANIFEST_BRANCH }}
          Device: [Device Tree/Branch](${{ inputs.DEVICE_TREE }}/tree/${{ inputs.DEVICE_TREE_BRANCH }})
          Commit: Most recent [commit](${{ inputs.DEVICE_TREE }}/commit/${{ env.COMMIT_ID }}) during building.
        prerelease: true

    - name: Run LDCheck
      if: inputs.LDCHECK == 'true'
      run: |
        cd tools
        mv -n libneeds ${GITHUB_WORKSPACE}/android-recovery/out/target/product/${{ inputs.DEVICE_NAME }}/recovery/root/
        mv -n ldcheck ${GITHUB_WORKSPACE}/android-recovery/out/target/product/${{ inputs.DEVICE_NAME }}/recovery/root/
        cd ../android-recovery/out/target/product/${{ inputs.DEVICE_NAME }}/recovery/root
        python3 ldcheck -p system/lib64:vendor/lib64:system/lib:vendor/lib -d ${{ inputs.LDCHECKPATH }}
        echo "Done checking missing dependencies. Review, and reconfigure your tree."
      continue-on-error: true
